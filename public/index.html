<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 语音助手</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-robot"></i> AI 语音助手</h1>
            <div class="status-indicator">
                <span id="connection-status" class="status-dot"></span>
                <span id="status-text">连接中...</span>
            </div>
        </header>

        <main class="main-content">
            <!-- 语音控制区域 -->
            <div class="voice-control-section">
                <div class="voice-button-container">
                    <button id="voice-btn" class="voice-btn">
                        <i class="fas fa-microphone"></i>
                        <span>按住说话</span>
                    </button>
                    <div class="voice-status">
                        <div id="voice-indicator" class="voice-indicator"></div>
                        <span id="voice-status-text">准备就绪</span>
                    </div>
                </div>
                
                <div class="input-section">
                    <div class="text-input-container">
                        <textarea id="text-input" placeholder="输入您的问题或指令..."></textarea>
                        <div class="input-buttons">
                            <button id="send-btn" class="send-btn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                            <button id="speak-btn" class="speak-btn" title="朗读回答">
                                <i class="fas fa-volume-up"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 对话显示区域 -->
            <div class="conversation-section">
                <div class="conversation-header">
                    <h3>对话记录</h3>
                    <button id="clear-btn" class="clear-btn">
                        <i class="fas fa-trash"></i> 清空
                    </button>
                </div>
                <div id="conversation-container" class="conversation-container">
                    <div class="welcome-message">
                        <i class="fas fa-comments"></i>
                        <p>欢迎使用AI语音助手！您可以：</p>
                        <ul>
                            <li>按住麦克风按钮进行语音输入</li>
                            <li>在文本框中输入问题</li>
                            <li>点击扬声器按钮听取回答</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- KPI 数据展示区域 -->
            <div class="kpi-section">
                <div class="kpi-header">
                    <h3>KPI 数据</h3>
                    <button id="refresh-kpi-btn" class="refresh-btn">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                </div>
                <div id="kpi-container" class="kpi-container">
                    <div class="kpi-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>加载KPI数据...</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- 设置面板 -->
        <div class="settings-panel" id="settings-panel">
            <div class="settings-header">
                <h3>设置</h3>
                <button id="close-settings" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="settings-content">
                <div class="setting-item">
                    <label>语音速度</label>
                    <input type="range" id="speech-rate" min="0.5" max="2" step="0.1" value="1">
                    <span id="rate-value">1.0</span>
                </div>
                <div class="setting-item">
                    <label>语音音调</label>
                    <input type="range" id="speech-pitch" min="0.5" max="2" step="0.1" value="1">
                    <span id="pitch-value">1.0</span>
                </div>
                <div class="setting-item">
                    <label>自动朗读回答</label>
                    <input type="checkbox" id="auto-speak" checked>
                </div>
            </div>
        </div>

        <!-- 浮动设置按钮 -->
        <button id="settings-btn" class="settings-btn">
            <i class="fas fa-cog"></i>
        </button>
    </div>

    <!-- 加载提示 -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-content">
            <i class="fas fa-spinner fa-spin"></i>
            <p>处理中...</p>
        </div>
    </div>

    <!-- 错误提示 -->
    <div id="error-toast" class="error-toast">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="error-message"></span>
        <button class="close-toast">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
